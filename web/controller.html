<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="screen-orientation" content="landscape">
  <title>Grow-a-Game Controller</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="controller-page">
  <main class="controller">
    <header>
      <p id="player-label" class="eyebrow">Player</p>
      <h1 id="game-name">Controller</h1>
      <span id="controller-status" class="connection">Connecting…</span>
    </header>
    <p id="controller-message" class="controller-message hidden" aria-live="polite"></p>
    <section id="controls" class="controls"></section>
    <p class="controller-note">Keep this tab open while playing.</p>
  </main>
  <script type="module" src="/static/controller.js"></script>
</body>
</html>
